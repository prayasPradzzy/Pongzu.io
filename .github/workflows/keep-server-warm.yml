# Render's free tier puts the multiplayer server to sleep after ~15 minutes
# without traffic, which makes the first player of the day wait up to a minute.
# Pinging it regularly keeps it awake. (A single always-on free service fits
# inside Render's monthly free hours.)
#
# Note: GitHub pauses scheduled workflows after 60 days with no commits to the
# repository — re-enable it from the Actions tab if that happens.
name: Keep server warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl --silent --show-error --max-time 90 --retry 2 https://pongzu-io.onrender.com/healthz
